openapi: 3.0.3
info:
  title: BookFlow Search API
  version: 1.0.0
paths:
  /v1/books/search:
    get:
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 10}
      responses:
        '200':
          description: Successful search
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/books:
    post:
      responses:
        '201':
          description: Book created
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
